<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang - TokoKita</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen">

  <div id="navbar-placeholder"></div>

  <!-- Page Header -->
  <div class="page-header py-10 px-4">
    <div class="max-w-4xl mx-auto flex items-center gap-4">
      <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center border border-white/10">
        <i class="fas fa-shopping-cart text-green-300 text-lg"></i>
      </div>
      <div>
        <h1 class="text-2xl font-extrabold text-white">Keranjang Belanja</h1>
        <p class="text-green-400/70 text-sm mt-0.5">Periksa kembali pesanan sebelum checkout</p>
      </div>
    </div>
  </div>

  <div class="max-w-4xl mx-auto px-4 py-8">

    <!-- Empty State -->
    <div id="empty-cart" class="hidden text-center py-24">
      <div class="w-32 h-32 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6 border-4 border-green-100">
        <i class="fas fa-cart-shopping text-5xl text-green-300"></i>
      </div>
      <h2 class="text-xl font-extrabold text-gray-700 mb-2">Keranjang Masih Kosong</h2>
      <p class="text-gray-400 mb-8">Yuk, mulai tambahkan produk favoritmu!</p>
      <a href="index.html" class="btn-primary inline-flex items-center gap-2 text-white px-8 py-3 rounded-xl font-semibold">
        <i class="fas fa-shopping-bag"></i> Mulai Belanja
      </a>
    </div>

    <!-- Cart Content -->
    <div id="cart-container">
      <div id="cart-items" class="space-y-3 mb-6"></div>

      <!-- Summary -->
      <div class="summary-card p-6">
        <h3 class="text-white font-bold text-lg mb-4 flex items-center gap-2">
          <i class="fas fa-receipt text-green-400"></i> Ringkasan Belanja
        </h3>
        <div class="flex justify-between text-green-300/80 text-sm mb-2">
          <span>Total Item</span>
          <span id="total-items" class="font-semibold">0 item</span>
        </div>
        <div class="border-t border-green-800/60 my-3"></div>
        <div class="flex justify-between text-white font-extrabold text-xl">
          <span>Total Harga</span>
          <span id="total-price" class="text-green-400">Rp 0</span>
        </div>
        <div class="flex gap-3 mt-6">
          <button onclick="clearCart()"
            class="flex-1 border border-red-500/40 text-red-400 py-2.5 rounded-xl hover:bg-red-500/10 transition font-semibold text-sm flex items-center justify-center gap-2">
            <i class="fas fa-trash"></i> Kosongkan
          </button>
          <a href="checkout.html"
            class="flex-2 btn-primary text-white py-2.5 px-6 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 flex-1">
            <i class="fas fa-credit-card"></i> Checkout Sekarang
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast-box toast-enter fixed bottom-6 right-6 text-white px-5 py-3.5 rounded-2xl hidden z-50 flex items-center gap-3 min-w-[260px]">
    <div class="w-8 h-8 bg-white/15 rounded-xl flex items-center justify-center flex-shrink-0">
      <i class="fas fa-check text-green-300 text-sm"></i>
    </div>
    <span id="toast-msg" class="text-sm font-semibold">Berhasil</span>
  </div>

  <script src="js/cart.js"></script>
</body>
</html>
